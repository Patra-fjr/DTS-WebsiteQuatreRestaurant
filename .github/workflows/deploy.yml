name: Deploy to All Laptops

on:
  push:
    branches: [master, 'feature/*', 'bugfix/*', 'hotfix/*', 'release/*', 'chore/*']

jobs:
  # ==================================================
  # JOB 1: DEPLOY KE LAPTOP TAUFIK
  # ==================================================
  deploy-taufik:  # ✅ BENAR (Pakai strip, tidak ada spasi)
    runs-on: [self-hosted, my-laptop] 
    
    steps:
      - name: Test version
        run: echo "VERSION 3"

      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Ensure Docker is running
        run: service docker start || true

      - name: Docker info
        run: docker info

      - name: Pull latest images
        run: docker compose pull || true

      - name: Stop existing containers
        run: docker compose down || true

      - name: Build images
        run: docker compose build --no-cache

      - name: Start containers
        run: docker compose up -d

      - name: Check running containers
        run: docker ps -a

  # ==================================================
  # JOB 2: DEPLOY KE LAPTOP PUTRA
  # ==================================================
  deploy-putra:  # ✅ PERBAIKAN: Ubah 'deploy putra' jadi 'deploy-putra'
    runs-on: [self-hosted, laptop-putra] 
    needs: [] # ✅ BENAR: Ini bikin dia jalan paralel (barengan)

    steps:
      - name: Test version
        run: echo "VERSION 3"

      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Ensure Docker is running
        run: service docker start || true

      - name: Docker info
        run: docker info

      - name: Pull latest images
        run: docker compose pull || true

      - name: Stop existing containers
        run: docker compose down || true

      - name: Build images
        run: docker compose build --no-cache

      - name: Start containers
        run: docker compose up -d

      - name: Check running containers
        run: docker ps -a